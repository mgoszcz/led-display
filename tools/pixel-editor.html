<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED Matrix Pixel Editor</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: #151515;
      color: #f2f2f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
      background: #151515;
    }

    main {
      width: min(920px, 100%);
      display: grid;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border: 1px solid #303030;
      background: #1d1d1d;
      border-radius: 8px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: #bdbdbd;
    }

    input[type="text"] {
      width: 220px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #111;
      color: #fff;
      font: inherit;
    }

    input[type="color"] {
      width: 52px;
      height: 38px;
      padding: 2px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #111;
      cursor: pointer;
    }

    input[type="range"] {
      width: 150px;
      accent-color: #0f6bff;
    }

    .range-label {
      min-width: 150px;
    }

    .range-value {
      color: #ffffff;
      font-weight: 700;
    }

    button {
      height: 38px;
      padding: 0 14px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #363636;
    }

    button.primary {
      background: #0f6bff;
      border-color: #2f7fff;
    }

    button.primary:hover {
      background: #287cff;
    }

    .status {
      min-height: 24px;
      color: #c9c9c9;
      font-size: 14px;
    }

    .status.ok {
      color: #7dff9c;
    }

    .status.error {
      color: #ff7d7d;
    }

    .editor {
      display: grid;
      grid-template-columns: minmax(280px, 560px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .grid {
      width: min(100%, 560px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(16, 1fr);
      gap: 2px;
      padding: 8px;
      border: 1px solid #303030;
      border-radius: 8px;
      background: #242424;
      user-select: none;
      touch-action: none;
    }

    .cell {
      width: 100%;
      min-width: 0;
      height: auto;
      padding: 0;
      aspect-ratio: 1;
      border: 1px solid #333;
      border-radius: 3px;
      background: rgb(0, 0, 0);
      cursor: crosshair;
    }

    .side {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid #303030;
      background: #1d1d1d;
      border-radius: 8px;
      color: #d8d8d8;
      font-size: 14px;
      line-height: 1.45;
    }

    code {
      color: #ffffff;
      background: #111;
      padding: 2px 5px;
      border-radius: 4px;
    }

    @media (max-width: 760px) {
      .editor {
        grid-template-columns: 1fr;
      }

      input[type="text"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>LED Matrix Pixel Editor</h1>

    <section class="toolbar" aria-label="Connection and drawing controls">
      <label>
        ESP32 IP
        <input id="ipInput" type="text" placeholder="192.168.1.123">
      </label>

      <button id="checkButton" type="button">CHECK</button>

      <label>
        Color
        <input id="colorInput" type="color" value="#2020ff">
      </label>

      <label class="range-label">
        Brightness <span id="brightnessValue" class="range-value">35%</span>
        <input id="brightnessInput" type="range" min="1" max="100" value="35">
      </label>

      <button id="clearButton" type="button">CLEAR</button>
      <button id="demoButton" type="button">DEMO</button>
      <button id="sendButton" class="primary" type="button">SEND</button>
    </section>

    <div id="status" class="status">Ready.</div>

    <section class="editor">
      <div id="grid" class="grid" aria-label="16 by 16 pixel grid"></div>

      <aside class="side">
        <div><strong>Left click</strong>: paint selected color</div>
        <div><strong>Right click</strong>: erase pixel</div>
        <div><strong>Brightness</strong>: scales RGB values while sending</div>
        <div><strong>Send</strong>: POST raw RGB888 frame to <code>/frame</code></div>
        <div><strong>Demo</strong>: POST to <code>/demo</code></div>
      </aside>
    </section>
  </main>

  <script>
    const MATRIX_WIDTH = 16;
    const MATRIX_HEIGHT = 16;
    const FRAME_BYTES = MATRIX_WIDTH * MATRIX_HEIGHT * 3;

    const ipInput = document.getElementById("ipInput");
    const checkButton = document.getElementById("checkButton");
    const colorInput = document.getElementById("colorInput");
    const brightnessInput = document.getElementById("brightnessInput");
    const brightnessValue = document.getElementById("brightnessValue");
    const clearButton = document.getElementById("clearButton");
    const demoButton = document.getElementById("demoButton");
    const sendButton = document.getElementById("sendButton");
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");

    const pixels = Array.from({ length: MATRIX_WIDTH * MATRIX_HEIGHT }, () => ({ r: 0, g: 0, b: 0 }));
    let isPointerDown = false;
    let eraseMode = false;

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function getBaseUrl() {
      const raw = ipInput.value.trim();
      if (!raw) {
        throw new Error("Enter ESP32 IP address first.");
      }

      if (raw.startsWith("http://") || raw.startsWith("https://")) {
        return raw.replace(/\/+$/, "");
      }

      return `http://${raw}`;
    }

    function hexToRgb(hex) {
      const value = hex.replace("#", "");
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16),
      };
    }

    function colorToCss(color) {
      return `rgb(${color.r}, ${color.g}, ${color.b})`;
    }

    function getBrightnessScale() {
      return Number(brightnessInput.value) / 100;
    }

    function scaleChannel(value, scale) {
      return Math.max(0, Math.min(255, Math.round(value * scale)));
    }

    function updateBrightnessValue() {
      brightnessValue.textContent = `${brightnessInput.value}%`;
    }

    function setPixel(index, color) {
      pixels[index] = { ...color };
      gridEl.children[index].style.background = colorToCss(color);
    }

    function paintCell(cell, erase) {
      const index = Number(cell.dataset.index);
      const color = erase ? { r: 0, g: 0, b: 0 } : hexToRgb(colorInput.value);
      setPixel(index, color);
    }

    function buildFrameBytes() {
      const bytes = new Uint8Array(FRAME_BYTES);
      const brightnessScale = getBrightnessScale();

      for (let i = 0; i < pixels.length; i++) {
        bytes[i * 3 + 0] = scaleChannel(pixels[i].r, brightnessScale);
        bytes[i * 3 + 1] = scaleChannel(pixels[i].g, brightnessScale);
        bytes[i * 3 + 2] = scaleChannel(pixels[i].b, brightnessScale);
      }

      return bytes;
    }

    function clearGrid() {
      for (let i = 0; i < pixels.length; i++) {
        setPixel(i, { r: 0, g: 0, b: 0 });
      }
      setStatus("Grid cleared.");
    }

    async function checkHealth() {
      try {
        const response = await fetch(`${getBaseUrl()}/health`, { method: "GET" });
        const text = await response.text();

        if (response.ok && text.trim() === "OK") {
          setStatus("ESP32 health check OK.", "ok");
        } else {
          setStatus(`Unexpected health response: ${response.status} ${text}`, "error");
        }
      } catch (error) {
        setStatus(`Health check failed: ${error.message}`, "error");
      }
    }

    async function sendFrame() {
      try {
        const response = await fetch(`${getBaseUrl()}/frame`, {
          method: "POST",
          body: buildFrameBytes(),
        });

        const text = await response.text();
        if (response.ok) {
          setStatus(`Frame sent: ${text || "OK"}`, "ok");
        } else {
          setStatus(`Frame failed: ${response.status} ${text}`, "error");
        }
      } catch (error) {
        setStatus(`Frame request failed: ${error.message}`, "error");
      }
    }

    async function enableDemo() {
      try {
        const response = await fetch(`${getBaseUrl()}/demo`, { method: "POST" });
        const text = await response.text();

        if (response.ok) {
          setStatus(`Demo enabled: ${text || "OK"}`, "ok");
        } else {
          setStatus(`Demo failed: ${response.status} ${text}`, "error");
        }
      } catch (error) {
        setStatus(`Demo request failed: ${error.message}`, "error");
      }
    }

    function createGrid() {
      for (let i = 0; i < MATRIX_WIDTH * MATRIX_HEIGHT; i++) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.dataset.index = String(i);
        cell.setAttribute("aria-label", `Pixel ${i}`);

        cell.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });

        cell.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          isPointerDown = true;
          eraseMode = event.button === 2;
          paintCell(cell, eraseMode);
        });

        cell.addEventListener("pointerenter", () => {
          if (isPointerDown) {
            paintCell(cell, eraseMode);
          }
        });

        cell.addEventListener("pointerup", () => {
          isPointerDown = false;
        });

        gridEl.appendChild(cell);
      }
    }

    document.addEventListener("pointerup", () => {
      isPointerDown = false;
    });

    checkButton.addEventListener("click", checkHealth);
    clearButton.addEventListener("click", clearGrid);
    sendButton.addEventListener("click", sendFrame);
    demoButton.addEventListener("click", enableDemo);
    brightnessInput.addEventListener("input", updateBrightnessValue);

    updateBrightnessValue();
    createGrid();
  </script>
</body>
</html>
